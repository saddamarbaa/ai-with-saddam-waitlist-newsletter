<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 864" width="1536" height="864" role="img" aria-label="Saddam Arbaa — AI Engineering | Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1E3F"/>
      <stop offset="60%" stop-color="#0E2A5A"/>
      <stop offset="100%" stop-color="#1E4FA8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#7CB8FF"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1A3B7A" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1536" height="864" fill="url(#bg)"/>
  <rect width="1536" height="864" fill="url(#grid)"/>
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#FFFFFF">
    <text x="120" y="380" font-size="148" font-weight="800" letter-spacing="-4">Saddam</text>
    <text x="120" y="540" font-size="148" font-weight="800" letter-spacing="-4" fill="url(#accent)">Arbaa</text>
    <line x1="120" y1="610" x2="700" y2="610" stroke="#7CB8FF" stroke-width="2" opacity="0.6"/>
    <text x="120" y="675" font-size="38" font-weight="500" letter-spacing="0.5" opacity="0.9">AI Engineering  |  Software Engineer</text>
  </g>
  <g opacity="0.18" fill="none" stroke="#7CB8FF" stroke-width="1.5">
    <circle cx="1240" cy="430" r="220"/>
    <circle cx="1240" cy="430" r="160"/>
    <circle cx="1240" cy="430" r="100"/>
  </g>
</svg>
